name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - dev

jobs:
  # CI
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
      image_tag: ${{ github.sha }}
      start_time: ${{ steps.start-time.outputs.start_time }}

    steps:

      - name: Record start time
        id: start-time
        run: echo "start_time=$(date -u +%s)" >> $GITHUB_OUTPUT

      # Slack 빌드 시작 알림
      - name: Send Slack start message
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHORT_COMMIT="${GITHUB_SHA::7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}"
          COMMIT_TIMESTAMP=$(date -d "${{ github.event.head_commit.timestamp }}" +%s)
          BUILD_START_TIMESTAMP=$(date +%s)
          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              { 
                "color": "#36a64f",
                "pretext": ":rocket: 백엔드 Dev stage 빌드 시작",
                "fields": [
                  { "title": "레포", "value": "${{ github.repository }}", "short": true },
                  { "title": "브랜치", "value": "$BRANCH", "short": true },
                  { "title": "담당자", "value": "<@U07PZVCA3LN>, <@U07QK8UB2HX>, <@U07QVC2UW48>" },
                  { "title": "커밋해시", "value": "<$RUN_URL|$SHORT_COMMIT>", "short": true },
                  { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                  { "title": "이미지 태그", "value": "$IMAGE", "short": false },
                  { "title": "푸시된 시간", "value": "<!date^${COMMIT_TIMESTAMP}^{date_short_pretty} {time_secs}|${{ github.event.head_commit.timestamp }}>", "short": false },
                  { "title": "빌드 시작 시간", "value": "<!date^${BUILD_START_TIMESTAMP}^{date_short_pretty} {time_secs}|시작됨>", "short": false }
                ],
                "footer": "Workflow",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}

      # 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle 캐시로 빌드 속도 향상
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Gradle 빌드 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Gradle로 빌드 및 테스트 실행
      - name: Build with Gradle
        run: ./gradlew build -x test

      # QEMU/Buildx 설정 (arm64 이미지 빌드용)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 및 푸시 (멀티 아키텍처)
      - name: Build and Push multi-arch image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # CD        
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      # 배포 스크립트 실행
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          password: ${{ secrets.ONPREM_SSH_PASSWORD }}
          port: ${{ secrets.ONPREM_SSH_PORT }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}
            docker stop new-project-container || true
            docker rm new-project-container || true
            # To Do. Graceful shut down
            docker run -d --name new-project-container --env-file ${{ secrets.ENV_FILE_PATH }} -p 8080:8080 --network="host" ${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}
            docker image prune

      # Slack 배포 완료 알림 (성공)
      - name: Send Slack completion message
        if: success()
        env:
          START_TIME: ${{ needs.build-and-push.outputs.start_time }}
        run: |
          END_TIME=$(date -u +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION/60))
          SEC=$((DURATION%60))
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHORT_COMMIT="${GITHUB_SHA::7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}"
          DIGEST="${{ needs.build-and-push.outputs.image_digest }}"
          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "#36a64f",
                "title": ":white_check_mark: 배포 성공",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch", "value": "$BRANCH", "short": true },
                  { "title": "Commit", "value": "<$RUN_URL|$SHORT_COMMIT>", "short": true },
                  { "title": "Duration", "value": "${MIN}m ${SEC}s", "short": true },
                  { "title": "Image", "value": "$IMAGE", "short": false },
                  { "title": "Image digest", "value": "$DIGEST", "short": false }
                ],
                "footer": "View run",
                "footer_icon": "https://github.githubassets.com/favicon.ico",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}

      # Slack 배포 실패 알림
      - name: Send Slack failure message
        if: failure()
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHORT_COMMIT="${GITHUB_SHA::7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "#ff0000",
                "title": ":x: 배포 실패",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch", "value": "$BRANCH", "short": true },
                  { "title": "Commit", "value": "<$RUN_URL|$SHORT_COMMIT>", "short": true }
                ],
                "footer": "View run for logs",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}    
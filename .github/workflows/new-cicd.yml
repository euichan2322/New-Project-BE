name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - dev

jobs:
  # CI
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
      image_tag: ${{ github.sha }}

    steps:
      # 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle 캐시로 빌드 속도 향상
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Gradle 빌드 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Gradle로 빌드 및 테스트 실행
      - name: Build with Gradle
        run: ./gradlew build -x test

      # QEMU/Buildx 설정 (arm64 이미지 빌드용)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 및 푸시 (멀티 아키텍처)
      - name: Build and Push multi-arch image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # CD        
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Slack 배포 시작 알림
      - name: Send Slack start message
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ dev 브랜치 배포가 시작되었습니다!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # 배포 스크립트 실행
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          password: ${{ secrets.ONPREM_SSH_PASSWORD }}
          port: ${{ secrets.ONPREM_SSH_PORT }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}
            docker stop new-project-container || true
            docker rm new-project-container || true
            # To Do. Graceful shut down
            docker run -d --name new-project-container --env-file ${{ secrets.ENV_FILE_PATH }} -p 8080:8080 --network="host" ${{ secrets.DOCKERHUB_USERNAME }}/new-project:${{ github.sha }}
            docker image prune

      # Slack 배포 완료 알림
      - name: Send Slack completion message
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ 배포가 성공적으로 완료되었습니다!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}